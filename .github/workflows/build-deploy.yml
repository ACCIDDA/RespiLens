name: Build and Deploy Site

on:
  schedule:
    # 1. Daily Full Build (Monday-Sunday) at 8 AM UTC (4 AM ET)
    - cron: '0 8 * * *'
    # 2. Hourly Wednesday and Thursday Full Build (every Wednesday)
    - cron: '0 * * * 3,4'  # Runs at the start of every hour (minute 0) on Wednesdays and Thursdays (days 3, 4)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  process-data:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout visualization repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Clone Forecast Hubs
      run: |
        # Shallow clones in parallel: only the current hub contents are needed, not history
        git clone --depth 1 https://github.com/cdcepi/FluSight-forecast-hub.git &
        git clone --depth 1 https://github.com/CDCgov/rsv-forecast-hub.git &
        git clone --depth 1 https://github.com/CDCgov/covid19-forecast-hub.git &
        git clone --depth 1 https://github.com/reichlab/flu-metrocast.git &
        for job in $(jobs -p); do wait "$job"; done
        echo "Forecast hubs cloned successfully."

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Assign colors to new models
      run: |
        python scripts/assign_model_colors.py \
          --flusight-hub-path FluSight-forecast-hub \
          --rsv-hub-path rsv-forecast-hub \
          --covid-hub-path covid19-forecast-hub \
          --flu-metrocast-hub-path flu-metrocast

    # The file has to outlive this run: a color is only permanent once committed.
    # A failed push isn't worth losing the deploy, and the next run tries again.
    - name: Commit new model colors
      run: |
        git add app/src/theme/modelColors.json
        if git diff --cached --quiet; then
          echo "No new model colors."
        else
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "assign colors to new models"
          git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" \
            || echo "::warning::Could not push new model colors; new models use a name-based color until the next run."
        fi

    - name: Cache Python dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy pyarrow tqdm requests hubdata jsonschema

    - name: Process All Datasets (Hubs + NHSN)
      run: |
        mkdir -p app/public/processed_data
        python scripts/process_RespiLens_data.py \
          --output-path $GITHUB_WORKSPACE/app/public/processed_data \
          --flusight-hub-path $GITHUB_WORKSPACE/FluSight-forecast-hub \
          --rsv-hub-path $GITHUB_WORKSPACE/rsv-forecast-hub \
          --covid-hub-path $GITHUB_WORKSPACE/covid19-forecast-hub \
          --flu-metrocast-hub-path $GITHUB_WORKSPACE/flu-metrocast \
          --NHSN \
          --NSSP

    - name: Upload all processed data as a single artifact
      uses: actions/upload-artifact@v4
      with:
        name: processed-data
        path: app/public/processed_data/
        if-no-files-found: error
        retention-days: 7

  build-and-deploy:  
    needs: [process-data]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Latest commit, to include the model colors the previous job pushed
          ref: ${{ github.ref_name }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'app/package-lock.json'
      - name: Download all processed data
        uses: actions/download-artifact@v4
        with:
          name: processed-data
          path: app/public/processed_data
      - name: Install dependencies
        working-directory: ./app
        run: npm ci
      - name: Build website
        working-directory: ./app
        env:
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
        run: |
          if [ "${{ github.repository }}" = "ACCIDDA/RespiLens-staging" ]; then
            npm run build:staging
          else
            npm run build
          fi
      - name: Copy index.html to 404.html for SPA routing
        working-directory: ./app
        run: cp dist/index.html dist/404.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./app/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
